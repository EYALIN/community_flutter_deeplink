name: community_flutter_deeplink
description: "Deep links for Flutter: the launch link, a stream of incoming links, launching and probing other apps, and text, images or a PDF shared to the app (Android)."
version: 1.2.1
homepage: https://github.com/EYALIN/community_flutter_deeplink
repository: https://github.com/EYALIN/community_flutter_deeplink
issue_tracker: https://github.com/EYALIN/community_flutter_deeplink/issues
funding:
  - https://github.com/sponsors/EYALIN
topics:
  - deep-link
  - deeplink
  - url-scheme
  - share
  - intent

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.community.flutter.deeplink
        pluginClass: CommunityFlutterDeeplinkPlugin
      ios:
        pluginClass: CommunityFlutterDeeplinkPlugin
